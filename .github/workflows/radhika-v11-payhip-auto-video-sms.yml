        uses: actions/checkout@v4

      - name: Check Payhip Shop - Auto Detect New Products
        id: payhip
        run: |
          echo "=================================================="
          echo "PAYHIP AUTO DETECT - kg214lll@gmail.com"
          echo "Shop: payhip.com/Radhikaonline"
          echo "=================================================="
          # Payhip shop ko fetch karo - new products check
          curl -sL "https://payhip.com/Radhikaonline" -o shop.html || echo "Fetch failed - using list"
          echo "Shop fetched - checking products..."
          
          # 10 Products list - auto rotation + new detect
          PRODUCTS=(
            "boat-front-luxury:Boat Front Luxury Edition 1.20:1.20:1000 AI Viral Prompts Yacht Pineapple"
            "antariksh-space:Antariksh Space Edition:4.99:Space Earth AI"
            "animal-facts:Amazing Animal Facts:2.99:100+ Animal Facts"
            "ai-websites:3 Secret AI Websites:5.99:AI Websites Blueprint"
            "365-vault:365 AI Content Vault:3.99:365 Days Content"
            "digital-premium:Digital Premium:9.99:Premium Collection"
            "wallpapers-100:Wallpapers 100 PC:2.40:Antique Wallpapers"
            "business-pack:AI Business Pack:11.99:Business Starter"
            "festival-vault:Festival Vault 365:7.00:Festival Content"
            "creator-kit:Creator Starter Kit:5.00:Creator Kit"
          )
          
          # Agar naya product Payhip pe hai toh auto add
          NEW_PRODUCT=$(grep -o 'payhip.com/b/[a-zA-Z0-9]*' shop.html | head -1 || echo "")
          if [ ! -z "$NEW_PRODUCT" ]; then
            echo "New product link found: $NEW_PRODUCT"
          fi
          
          DAY=$(date +%d)
          HOUR=$(date +%H)
          INDEX=$(( (DAY + HOUR) % 10 ))
          SELECTED=${PRODUCTS[$INDEX]}
          IFS=':' read -r SLUG NAME PRICE DESC <<< "$SELECTED"
          
          echo "TODAY AUTO PRODUCT: $SLUG - $NAME - \$$PRICE"
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "price=$PRICE" >> $GITHUB_OUTPUT
          echo "desc=$DESC" >> $GITHUB_OUTPUT

      - name: Auto Video Script Generate - No CapCut Needed
        run: |
          SLUG="${{ steps.payhip.outputs.slug }}"
          NAME="${{ steps.payhip.outputs.name }}"
          PRICE="${{ steps.payhip.outputs.price }}"
          DESC="${{ steps.payhip.outputs.desc }}"
          
          echo "=================================================="
          echo "AUTO VIDEO BANEGA - $SLUG"
          echo "Product: $NAME - $DESC - Price \$$PRICE"
          echo "=================================================="
          
          # Auto video script - 10 sec
          cat > video-script.txt <<EOF
          VIDEO: $SLUG - 10 sec - 9:16
          Scene 1 (0-3s): $NAME - Premium Cover - Gold Text - Yacht/Boat Front
          Scene 2 (3-6s): $DESC - Features List - 3 Points
          Scene 3 (6-10s): Price \$$PRICE - Shop payhip.com/Radhikaonline - WhatsApp wa.me/917996928762
          Text Overlay: Radhika Agency BEST V9 - No Dhemaji - 10 Products - krr908
          Music: Trending - No Copyright
          CTA: Shop Now - Link in Bio / Comment
          EOF
          
          cat video-script.txt
          
          # Agar videos folder me real MP4 hai toh use karo, nahi toh placeholder
          if [ -f "videos/${SLUG}.mp4" ]; then
            echo "Real video found: videos/${SLUG}.mp4 - $(du -h videos/${SLUG}.mp4 | cut -f1)"
            echo "VIDEO_READY=true" >> $GITHUB_ENV
          else
            echo "No real video - Need to upload videos/${SLUG}.mp4 - 10 sec - 5-15MB"
            echo "Create video from script: video-script.txt"
            echo "Use Google Photos Highlight Video or InShot - 15 sec - MP4"
            echo "VIDEO_READY=false" >> $GITHUB_ENV
          fi

